name: Cleanup Old SpotDL Branches

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Delete branches older than N days"
        required: false
        default: "30"
        type: string
      keep_latest:
        description: "Always keep the N most recent branches (by date in name)"
        required: false
        default: "5"
        type: string
      dry_run:
        description: "Preview only — no branches will be deleted"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: spotdl-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete old branches
        env:
          RETENTION_DAYS: ${{ inputs.retention_days || '30' }}
          KEEP_LATEST:    ${{ inputs.keep_latest    || '5' }}
          DRY_RUN:        ${{ inputs.dry_run }}
        run: |
          # Only branches matching the auto-generated naming pattern are candidates.
          # Handles both new format (2026-11-18-r12) and legacy format (2026-11-18).
          PATTERN='^[0-9]{4}-[0-9]{2}-[0-9]{2}(-r[0-9]+)?$'
          CUTOFF_DATE=$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%d)
          CUTOFF_EPOCH=$(date -u -d "$CUTOFF_DATE" +%s)

          echo "Retention  : ${RETENTION_DAYS} days (cutoff: ${CUTOFF_DATE})"
          echo "Keep latest: ${KEEP_LATEST}"
          echo "Dry run    : ${DRY_RUN:-false (scheduled)}"
          echo "---"

          git fetch --all --prune --quiet

          # List remote branches matching pattern, newest first, skip 'HEAD'
          ALL=$(git branch -r | sed 's|^\s*origin/||' | grep -E "$PATTERN" | grep -v '^HEAD$' | sort -r || true)
          if [ -z "$ALL" ]; then
            echo "No branches match the naming pattern — nothing to do."
            exit 0
          fi

          TOTAL=$(echo "$ALL" | wc -l)
          echo "Found ${TOTAL} matching branch(es):"
          echo "$ALL"
          echo "---"

          # Skip the N most recent (regardless of age)
          TO_CONSIDER=$(echo "$ALL" | tail -n +$((KEEP_LATEST + 1)) || true)
          if [ -z "$TO_CONSIDER" ]; then
            echo "Only ${KEEP_LATEST} or fewer branches exist — keeping all."
            exit 0
          fi

          DELETED=0
          KEPT=0
          FAILED=0

          for branch in $TO_CONSIDER; do
            BRANCH_DATE=$(echo "$branch" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')
            if [ -z "$BRANCH_DATE" ]; then
              echo "SKIP        : $branch (unparseable date)"
              continue
            fi
            BRANCH_EPOCH=$(date -u -d "$BRANCH_DATE" +%s)

            if [ "$BRANCH_EPOCH" -lt "$CUTOFF_EPOCH" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "WOULD DELETE: $branch (dated $BRANCH_DATE)"
                DELETED=$((DELETED + 1))
              else
                echo "DELETING    : $branch (dated $BRANCH_DATE)"
                if git push origin --delete "$branch"; then
                  DELETED=$((DELETED + 1))
                else
                  echo "  FAILED — possibly already gone or protected"
                  FAILED=$((FAILED + 1))
                fi
              fi
            else
              echo "KEEP        : $branch (dated $BRANCH_DATE, within retention)"
              KEPT=$((KEPT + 1))
            fi
          done

          echo ""
          if [ "$DRY_RUN" = "true" ]; then
            echo "Summary: ${DELETED} branch(es) WOULD be deleted, ${KEPT} kept."
            echo "Re-run with dry_run = false to actually delete."
          else
            echo "Summary: ${DELETED} deleted, ${KEPT} kept, ${FAILED} failed."
          fi
        
