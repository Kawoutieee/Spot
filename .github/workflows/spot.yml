name: SpotDL Download

on:
  workflow_dispatch:
    inputs:
      spotify_url:
        description: "Public Spotify playlist/album/track URL"
        required: true
        type: string
      quality:
        description: "Download quality (256kbps requires YT_COOKIES + High Quality account setting)"
        required: true
        type: choice
        options:
          - 128kbps
          - 256kbps
        default: 128kbps
      branch_name:
        description: "Branch name override (default: UTC date YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: spotdl-${{ github.repository }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install spotdl
        run: |
          python -m pip install --upgrade pip
          python -m pip install spotdl

      - name: Print versions
        run: |
          spotdl --version
          ffmpeg -version | head -n 1
          deno --version

      - name: Prepare cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then
            echo "::error::YT_COOKIES secret is empty. GitHub runner IPs are blocked by YouTube bot detection, so cookies are mandatory. Export cookies from music.youtube.com and add them as a repository secret."
            exit 1
          fi
          printf '%s\n' "$YT_COOKIES" | tr -d '\r' > cookies.txt
          LINES=$(wc -l < cookies.txt)
          echo "cookies.txt written: $LINES lines"
          echo "First line: $(head -1 cookies.txt)"
          if ! head -1 cookies.txt | grep -qi "netscape"; then
            echo "::warning::cookies.txt first line doesn't mention 'Netscape'. Expected: '# Netscape HTTP Cookie File'. The file may be in JSON format instead of Netscape."
          fi
          if ! grep -q "youtube.com" cookies.txt; then
            echo "::error::cookies.txt contains no youtube.com cookies. Re-export while logged in at music.youtube.com."
            exit 1
          fi

      - name: Download audio (YouTube Music)
        env:
          SPOTIFY_URL: ${{ inputs.spotify_url }}
        run: |
          mkdir -p downloads
          set +e
          spotdl download "$SPOTIFY_URL" \
            --output "downloads/{artist}/{title}.{output-ext}" \
            --format m4a \
            --bitrate disable \
            --audio youtube-music \
            --cookie-file cookies.txt \
            --generate-lrc \
            --lyrics synced genius \
            --restrict ascii \
            --print-errors 2>&1 | tee spotdl-errors.log
          RC=${PIPESTATUS[0]}
          echo "First pass exit code: $RC"
          if [ "$RC" -ne 0 ]; then
            echo "::warning::spotdl first pass failed with exit code $RC"
            echo "--- Last 30 lines of spotdl log ---"
            tail -30 spotdl-errors.log
            echo "--- End of log tail ---"
          fi
          exit 0

      - name: Fallback download (regular YouTube)
        env:
          SPOTIFY_URL: ${{ inputs.spotify_url }}
        run: |
          if find downloads -type f -name '*.m4a' | grep -q .; then
            echo "First pass produced files — skipping fallback."
            exit 0
          fi
          echo "First pass produced no files. Trying --audio youtube as fallback..."
          set +e
          spotdl download "$SPOTIFY_URL" \
            --output "downloads/{artist}/{title}.{output-ext}" \
            --format m4a \
            --bitrate disable \
            --audio youtube \
            --cookie-file cookies.txt \
            --generate-lrc \
            --lyrics synced genius \
            --restrict ascii \
            --print-errors 2>&1 | tee -a spotdl-errors.log
          RC=${PIPESTATUS[0]}
          echo "Fallback pass exit code: $RC"
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Fallback also failed"
            echo "--- Last 30 lines of spotdl log ---"
            tail -30 spotdl-errors.log
          fi
          exit 0

      - name: Retry failed tracks
        env:
          SPOTIFY_URL: ${{ inputs.spotify_url }}
        run: |
          set +e
          spotdl download "$SPOTIFY_URL" \
            --output "downloads/{artist}/{title}.{output-ext}" \
            --format m4a \
            --bitrate disable \
            --audio youtube-music \
            --cookie-file cookies.txt \
            --generate-lrc \
            --lyrics synced genius \
            --restrict ascii \
            --overwrite skip \
            --print-errors 2>&1 | tee -a spotdl-errors.log
          RC=${PIPESTATUS[0]}
          echo "Retry pass exit code: $RC"
          exit 0

      - name: Cleanup cookies
        if: always()
        run: rm -f cookies.txt

      - name: Verify downloads
        run: |
          echo "--- Contents of downloads/ ---"
          find downloads -type f | head -50
          echo "--- File count: $(find downloads -type f -name '*.m4a' | wc -l) ---"

          if ! find downloads -type f -name '*.m4a' | grep -q .; then
            echo "::error::No audio files were downloaded. Below is the spotdl log — the actual error is in there:"
            echo "===== SPOTDL LOG (last 80 lines) ====="
            tail -80 spotdl-errors.log 2>/dev/null || echo "(spotdl-errors.log not found)"
            echo "===== END LOG ====="
            echo ""
            echo "Common causes:"
            echo "  1. YT_COOKIES expired → re-export from music.youtube.com"
            echo "  2. YouTube IP-blocked the runner → retry the run (GitHub IPs rotate)"
            echo "  3. Track region-locked → try a different track"
            exit 1
          fi
          echo "Total download size: $(du -sh downloads | cut -f1)"

      - name: Stash output outside git tree
        run: |
          mkdir -p "$RUNNER_TEMP/spotdl-out"
          cp -a downloads/. "$RUNNER_TEMP/spotdl-out/"
          cp -f spotdl-errors.log "$RUNNER_TEMP/spotdl-out/" 2>/dev/null || true

      - name: Push to orphan branch
        env:
          BRANCH_INPUT: ${{ inputs.branch_name }}
        run: |
          BRANCH="${BRANCH_INPUT:-$(date -u +%Y-%m-%d)}"
          BRANCH=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-.]+//; s/[-.]+$//; s/\.lock$//')
          if [ -z "$BRANCH" ]; then
            BRANCH=$(date -u +%Y-%m-%d)
          fi
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "::error::Refusing to force-push to protected branch '$BRANCH'."
            exit 1
          fi
          echo "Pushing to branch: $BRANCH"
          git checkout --orphan "$BRANCH"
          git rm -rf . || true
          git clean -fdx || true
          cp -a "$RUNNER_TEMP/spotdl-out/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spotdl download $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin "$BRANCH"
